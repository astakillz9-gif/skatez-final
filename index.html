<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKATEZ FINALS - DAY & NIGHT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;font-family:'Orbitron';background:#000}
#gameCanvas{width:100vw;height:100vh;display:block}
#ui{position:absolute;top:0;left:0;width:100%;padding:10px;display:flex;justify-content:space-between;z-index:10;flex-wrap:wrap;gap:6px}
.ui-box{background:rgba(0,0,0,0.85);border:2px solid #00f2ff;border-radius:10px;padding:6px 12px;color:#fff;font-size:12px}
#centerUI{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;background:rgba(0,0,0,0.6);padding:20px;border-radius:20px;backdrop-filter:blur(10px)}
.btn{background:linear-gradient(135deg,#00f2ff,#7000ff);border:none;padding:10px 20px;border-radius:20px;color:white;font-family:'Orbitron';font-weight:900;cursor:pointer;margin:4px;box-shadow:0 0 12px #00f2ff;font-size:14px}
#redeemBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;border:3px solid gold;border-radius:16px;padding:18px;z-index:30;display:none;width:92%;max-width:340px;text-align:center}
#redeemBox input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:2px solid gold;background:#111;color:gold;text-align:center;font-family:'Orbitron'}
#controls{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
.cbtn{width:58px;height:58px;background:rgba(255,255,255,0.2);backdrop-filter:blur(8px);border:2px solid #fff;border-radius:50%;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
#dayNightBtn{position:absolute;top:60px;right:10px;z-index:10;background:rgba(0,0,0,0.8);border:2px solid #fff;border-radius:20px;padding:6px 14px;color:#fff;font-size:12px;cursor:pointer}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui">
<div class="ui-box">⭐ <span id="starCount">0</span></div>
<div class="ui-box">🏆 <span id="score">0</span></div>
<div class="ui-box" onclick="openRedeem()" style="cursor:pointer;border-color:gold">🎁 CODE</div>
</div>
<div id="dayNightBtn" onclick="toggleDayNight()">🌙 NIGHT MODE</div>
<div id="centerUI">
<h1 style="color:#00f2ff;font-size:28px;text-shadow:0 0 15px #00f2ff">SKATEZ FINALS</h1>
<p id="modeText" style="color:#fff;background:#00f2ff;color:#000;padding:2px 10px;border-radius:8px;display:inline-block;margin:6px 0;font-size:12px">☀️ NYC DAY MODE</p><br>
<button class="btn" onclick="startGame()">PLAY 🛹</button>
<p style="color:#aaa;font-size:10px;margin-top:8px">Use ◀ ▶ to move, ⬆ to jump<br>Toggle Day/Night anytime!</p>
</div>
<div id="redeemBox">
<h2 style="color:gold;font-size:16px">🎁 REDEEM CODE</h2>
<input id="codeInput" placeholder="Skate1.5kate">
<button class="btn" style="background:gold;color:#000;width:100%" onclick="checkCode()">REDEEM</button>
<button class="btn" style="background:#333;width:100%" onclick="closeRedeem()">CLOSE</button>
<p id="redeemMsg" style="color:white;margin-top:6px;font-size:12px"></p>
</div>
<div id="controls">
<div class="cbtn" ontouchstart="keys.left=true" ontouchend="keys.left=false">◀</div>
<div class="cbtn" ontouchstart="keys.jump=true" ontouchend="keys.jump=false">⬆</div>
<div class="cbtn" ontouchstart="keys.right=true" ontouchend="keys.right=false">▶</div>
</div>
<script>
let scene,camera,renderer,skater,keys={left:false,right:false,jump:false},velY=0,jumping=false,score=0,stars=parseInt(localStorage.getItem('stars')||'0'),game=false,redeemed=JSON.parse(localStorage.getItem('redeemed')||'{}'),isDay=true,ambient,sun,pointLights=[],buildings=[];
document.getElementById('starCount').innerText=stars;
function init(){
scene=new THREE.Scene();scene.fog=new THREE.Fog(0x87CEEB,40,140);scene.background=new THREE.Color(0x87CEEB);
camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gameCanvas'),antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.shadowMap.enabled=true;
ambient=new THREE.AmbientLight(0xffffff,0.7);scene.add(ambient);
sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(30,50,20);sun.castShadow=true;scene.add(sun);
let p1=new THREE.PointLight(0xffaa00,0,30);p1.position.set(10,8,10);scene.add(p1);pointLights.push(p1);
let p2=new THREE.PointLight(0x00f2ff,0,30);p2.position.set(-15,8,-5);scene.add(p2);pointLights.push(p2);
let g=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x999999}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
// Buildings store
function makeBld(x,z,w,h,d,col){
let geo=new THREE.BoxGeometry(w,h,d);let mat=new THREE.MeshStandardMaterial({color:col});let m=new THREE.Mesh(geo,mat);m.position.set(x,h/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);buildings.push({mesh:m,origCol:col,windows:[]});
for(let wy=3;wy<h-2;wy+=3){for(let wx=-w/2+1;wx<w/2;wx+=2.5){let winMat=new THREE.MeshStandardMaterial({color:0x88ccff});let win=new THREE.Mesh(new THREE.PlaneGeometry(1,1.4),winMat);win.position.set(x+wx,wy,z+d/2+0.02);scene.add(win);buildings[buildings.length-1].windows.push(win);}}
}
makeBld(-20,-30,14,40,14,0xcccccc);makeBld(22,-35,16,50,14,0xd9c5a5);makeBld(-25,20,12,32,12,0xb0b0b0);makeBld(28,18,15,42,15,0xc2b280);makeBld(0,-65,90,60,8,0xbbbbbb);
// Ramps
function ramp(x,z){let m=new THREE.Mesh(new THREE.BoxGeometry(7,1,12),new THREE.MeshStandardMaterial({color:0x666666}));m.position.set(x,0.5,z);m.receiveShadow=true;scene.add(m);let i=new THREE.Mesh(new THREE.BoxGeometry(7,2,5),new THREE.MeshStandardMaterial({color:0x555555}));i.position.set(x,1.2,z-4);i.rotation.x=Math.PI/7;i.castShadow=true;scene.add(i);}
ramp(0,-12);ramp(10,10);ramp(-12,5);
// Character - Upgraded skater
let g2=new THREE.Group();
let pantsMat=new THREE.MeshStandardMaterial({color:0x2222aa});let legGeo=new THREE.CapsuleGeometry(0.18,0.8,4,8);
let l1=new THREE.Mesh(legGeo,pantsMat);l1.position.set(-0.2,0.6,0);g2.add(l1);let l2=new THREE.Mesh(legGeo,pantsMat);l2.position.set(0.2,0.6,0);g2.add(l2);
let shoeMat=new THREE.MeshStandardMaterial({color:0x111111});let s1=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.6),shoeMat);s1.position.set(-0.2,0.15,0.1);g2.add(s1);let s2=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.2,0.6),shoeMat);s2.position.set(0.2,0.15,0.1);g2.add(s2);
let bodyMat=new THREE.MeshStandardMaterial({color:0x00d4ff});let body=new THREE.Mesh(new THREE.CapsuleGeometry(0.35,0.9,4,8),bodyMat);body.position.y=1.45;body.castShadow=true;g2.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(0.32,16,16),new THREE.MeshStandardMaterial({color:0xffdbac}));head.position.y=2.3;head.castShadow=true;g2.add(head);
let capMat=new THREE.MeshStandardMaterial({color:0x111111});let cap=new THREE.Mesh(new THREE.SphereGeometry(0.34,16,16,0,Math.PI*2,0,Math.PI/2),capMat);cap.position.y=2.45;cap.rotation.x=Math.PI;g2.add(cap);
let brim=new THREE.Mesh(new THREE.CylinderGeometry(0.35,0.35,0.03,16),capMat);brim.position.set(0,2.4,0.3);brim.rotation.x=0.3;g2.add(brim);
let board=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.08,1.9),new THREE.MeshStandardMaterial({color:0x222222}));board.position.y=0.08;g2.add(board);
let wGeo=new THREE.CylinderGeometry(0.1,0.1,0.62,12);let wMat=new THREE.MeshStandardMaterial({color:0xffffff});
let w1=new THREE.Mesh(wGeo,wMat);w1.rotation.z=Math.PI/2;w1.position.set(0,0.02,0.5);g2.add(w1);let w2=new THREE.Mesh(wGeo,wMat);w2.rotation.z=Math.PI/2;w2.position.set(0,0.02,-0.5);g2.add(w2);
skater=g2;skater.position.set(0,1,0);scene.add(skater);
camera.position.set(0,5,11);camera.lookAt(skater.position);
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
animate();
}
