<!DOCTYPE html>

<head>

<title>SKATEZ FINALS - OPEN WORLD NYC</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{margin:0;overflow:hidden;background:#87CEEB;font-family:'Orbitron',sans-serif;touch-action:none}
canvas{display:block}#gameCanvas{width:100vw;height:100vh}
#ui{position:absolute;top:0;left:0;width:100%;padding:8px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.box{background:rgba(0,0,0,0.8);border:2px solid #00f2ff;border-radius:10px;padding:6px 10px;color:#fff;font-size:11px;pointer-events:auto}
#minimap{position:absolute;bottom:10px;left:10px;width:110px;height:110px;border:3px solid #fff;border-radius:50%;background:rgba(0,0,0,0.7);z-index:10;overflow:hidden}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;background:rgba(0,0,0,0.75);padding:22px;border-radius:20px;backdrop-filter:blur(8px);border:2px solid #00f2ff}
.btn{background:linear-gradient(135deg,#00f2ff,#7000ff);border:none;padding:12px 26px;border-radius:25px;color:#fff;font-family:'Orbitron';font-weight:900;font-size:14px;cursor:pointer;margin:6px;box-shadow:0 0 15px #00f2ff;pointer-events:auto;touch-action:manipulation}
#controls{position:absolute;bottom:10px;right:10px;display:flex;flex-direction:column;gap:8px;z-index:10}
.row{display:flex;gap:8px;justify-content:center}
.cbtn{width:55px;height:55px;background:rgba(255,255,255,0.25);backdrop-filter:blur(6px);border:2px solid #fff;border-radius:50%;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none}
#trick{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#ffcc00;padding:6px 14px;border-radius:10px;font-size:13px;z-index:10;display:none}
#mission{position:absolute;top:70px;left:10px;background:rgba(0,0,0,0.8);border-left:4px solid #ffcc00;color:#fff;padding:8px 12px;border-radius:8px;font-size:11px;z-index:10;max-width:200px}
#redeemBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;border:3px solid gold;border-radius:16px;padding:18px;z-index:50;display:none;width:90%;max-width:340px;text-align:center}
#redeemBox input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:2px solid gold;background:#111;color:gold;text-align:center;font-family:'Orbitron'}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<div id="center">
<h1 style="color:#00f2ff;font-size:26px;text-shadow:0 0 15px #00f2ff">SKATEZ FINALS</h1>
<p style="color:#fff;font-size:12px;margin:6px 0;background:#00f2ff;color:#000;display:inline-block;padding:3px 10px;border-radius:8px">🌍 OPEN WORLD • NYC • MULTIPLAYER</p>
<p style="color:#aaa;font-size:10px;margin:8px 0">WASD / Joystick to move<br>SPACE = Ollie / Kickflip</p>
<button id="playBtn" class="btn">PLAY NOW 🛹</button>

<div id="controls">
<div class="row"><div class="cbtn" id="up">▲</div></div>

<div class="row"><div class="cbtn" id="jumpBtn" style="width:120px;border-radius:20px;background:gold;color:#000;font-weight:900">OLLIE</div></div>
</div>
<div id="redeemBox">
<h2 style="color:gold">🎁 REDEEM</h2>
<input id="codeInput" placeholder="Enter Code">

<button class="btn" style="background:#333;width:100%" onclick
  ="closeRedeem()">CLOSE</button>
<p id="redeemMsg" style="color:#fff;font-size:11px;margin-top:6px"></p>
</div>
